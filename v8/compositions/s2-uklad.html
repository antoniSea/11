<template id="s2-uklad-template">
  <div data-composition-id="s2-uklad" data-width="1080" data-height="1920" data-duration="8">
    <style>
      #s2Deg { position: absolute; left: 0; right: 0; top: 588px; text-align: center; font-family: var(--mono); font-weight: 600; font-size: 84px; color: var(--oil); letter-spacing: -0.04em; opacity: 0; text-shadow: 0 6px 30px rgba(4,6,9,0.9); }
      #s2Cmp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
      #s2Chip { position: absolute; left: 70px; top: 1494px; opacity: 0; font-size: 40px; }
    </style>

    <div class="kick" id="s2K">Układ</div>
    <div class="ttl" id="s2T">Dwa rzędy po cztery.<br>Kąt <em>90°</em></div>

    <svg class="bsvg" viewBox="0 0 1080 1920">
      <g id="s2Eng"></g>
      <g id="s2Ang" opacity="0">
        <line x1="540" y1="1020" x2="172" y2="652" stroke="#f5aa3c" stroke-width="3" stroke-dasharray="12 10" />
        <line x1="540" y1="1020" x2="908" y2="652" stroke="#f5aa3c" stroke-width="3" stroke-dasharray="12 10" />
        <path id="s2Arc" d="M 222 702 A 450 450 0 0 1 858 702" fill="none" stroke="#f5aa3c" stroke-width="6" stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="720" />
      </g>
    </svg>
    <div id="s2Deg">90°</div>

    <svg id="s2Cmp" class="bsvg" viewBox="0 0 1080 1920">
      <text x="70" y="1262">Rzędowa ósemka</text>
      <g id="s2I8"></g>
      <text x="70" y="1376">V8</text>
      <g id="s2V8"></g>
      <g id="s2M1" opacity="0"><line x1="718" y1="1277" x2="718" y2="1465" stroke="#eef2f7" stroke-width="3" stroke-dasharray="8 8" /><line x1="449" y1="1430" x2="712" y2="1430" stroke="#ff6a4d" stroke-width="4" /><path d="M 449 1418 L 449 1442" stroke="#ff6a4d" stroke-width="4" /><path d="M 712 1418 L 712 1442" stroke="#ff6a4d" stroke-width="4" /></g>
      <text id="s2MT" x="736" y="1440" style="fill:#ff6a4d;font-size:28px;font-weight:600;letter-spacing:0.04em" opacity="0">PRAWIE 2× KRÓCEJ</text>
    </svg>
    <div id="s2Chip" class="chip">Mieści się pod maską</div>

    <script>
      (function () {
        const { vSection, el } = window.V8;
        const eng = vSection(document.getElementById("s2Eng"), { cx: 540, cy: 1020, s: 0.95 });
        const st = { deg: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(st, { deg: 360 * 5, duration: 8, ease: "none", onUpdate: () => eng.update(st.deg) }, 0);

        // porównanie długości: 8 w rzędzie vs 2 x 4 z przesunięciem rzędów
        const i8 = document.getElementById("s2I8"), v8 = document.getElementById("s2V8");
        const pitch = 78, x0 = 70, y8 = 1285, yv = 1397;
        el("rect", { x: x0, y: y8 - 8, width: pitch * 8 + 16, height: 76, rx: 10, fill: "#1b222b", stroke: "rgba(150,165,182,0.5)", "stroke-width": 2 }, i8);
        el("rect", { x: x0, y: yv - 8, width: pitch * 4 + pitch / 2 + 16, height: 76, rx: 10, fill: "#1b222b", stroke: "rgba(245,170,60,0.6)", "stroke-width": 2 }, v8);
        const cells = [];
        for (let i = 0; i < 8; i++) cells.push(el("circle", { cx: x0 + 8 + pitch / 2 + i * pitch, cy: y8 + 30, r: 30, fill: "#8a95a2", opacity: 0 }, i8));
        for (let i = 0; i < 4; i++) {
          cells.push(el("circle", { cx: x0 + 8 + pitch / 2 + i * pitch, cy: yv + 18, r: 20, fill: "#f5aa3c", opacity: 0 }, v8));
          cells.push(el("circle", { cx: x0 + 8 + pitch + i * pitch, cy: yv + 42, r: 20, fill: "#ffd79a", opacity: 0 }, v8));
        }

        tl.fromTo("#s2T", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);
        tl.to("#s2Ang", { opacity: 1, duration: 0.2 }, 1.2);
        tl.to("#s2Arc", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 1.2);
        tl.fromTo("#s2Deg", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.7);

        // "silnik jest krótki i niski"
        tl.to("#s2Cmp", { opacity: 1, duration: 0.25 }, 3.9);
        tl.to(cells.slice(0, 8), { opacity: 1, duration: 0.12, stagger: 0.06 }, 4.0);
        tl.to(cells.slice(8), { opacity: 1, duration: 0.12, stagger: 0.06 }, 4.5);
        tl.to(["#s2M1", "#s2MT"], { opacity: 1, duration: 0.25 }, 5.2);
        tl.fromTo("#s2Chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 6.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["s2-uklad"] = tl;
      })();
    </script>
  </div>
</template>
